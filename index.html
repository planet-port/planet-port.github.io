<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planet Port — 选择一种风格</title>
  <meta name="description" content="Planet Port 品牌网站：现代与未来两种风格方案。" />
  <link rel="icon" href="/assets/planet-port-logo.webp" />
  <link rel="stylesheet" href="/styles/entry.css" />
</head>
<body>
  <header class="entry-header">
    <div class="entry-brand">
      <img src="/assets/planet-port-logo.webp" alt="Planet Port logo" width="44" height="44" />
      <h1>Planet Port</h1>
    </div>
    <p class="entry-tag">跨平台 ZeroTier 多 Planet 客户端，两种风格任选</p>
  </header>

  <main class="entry-split">
    <article class="pane pane--modern">
      <h2><a href="/modern.html">现代</a></h2>
      <p class="pane__desc">石墨与信号橙，产品在页面上工作</p>
      <div class="pane__preview">
        <span class="pv-rows" data-ui>
          <span class="pv-row">切换 Planet<span class="pv-key">⌘2</span></span>
          <span class="pv-row pv-row--on">eval $(planet-port use company)</span>
        </span>
        <img class="pv-shot" src="/assets/screenshots/android-home.webp" alt="Planet Port Android 版界面" width="120" height="240" />
        <img class="pv-shot pv-shot--short" src="/assets/screenshots/android-settings.webp" alt="Planet Port Android 设置界面" width="110" height="200" />
      </div>
      <a class="pane__cta" href="/modern.html">进入现代版</a>
    </article>
    <article class="pane pane--future">
      <h2><a href="/future.html">未来</a></h2>
      <p class="pane__desc">深空与信号蓝，一颗行星贯穿全页</p>
      <div class="pane__preview">
        <img class="pv-shot pv-shot--round" src="/assets/screenshots/ios-home.webp" alt="Planet Port iOS 版界面" width="200" height="200" />
        <img class="pv-shot" src="/assets/screenshots/ios-network.webp" alt="Planet Port iOS 网络列表" width="96" height="192" />
      </div>
      <a class="pane__cta" href="/future.html">进入未来版</a>
    </article>
  </main>

  <footer class="entry-footer">
    <a href="https://github.com/planet-port">GitHub 仓库</a>
    <span>Planet Port 是社区驱动的非官方 ZeroTier 客户端，与 ZeroTier, Inc. 无隶属关系。</span>
  </footer>
  <script type="module" src="/scripts/entry.js"></script>
</body>
</html>
